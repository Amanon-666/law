name: ReFi R1 fixed-evidence audit
on:
  push:
    branches: [research/uji-core-refactor-20261101]
    paths: ['.github/workflows/refi-r1-fixed-evidence.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Audit immutable single-scan protocol
        run: |
          python - <<'PY'
          import json,zipfile,hashlib,pathlib
          z=zipfile.ZipFile('research/uji_core/evidence.zip')
          names=z.namelist()
          print('N_FILES',len(names))
          for name in names:
              if name.endswith('/'): continue
              q=z.getinfo(name)
              if not name.endswith(('.json','.txt','.md','.csv','.npz')):continue
              print('MEMBER',name,q.file_size)
              if name.endswith('.json'):
                  b=z.read(name); d=json.loads(b)
                  print('JSON_SHA',hashlib.sha256(b).hexdigest())
                  if isinstance(d,dict):
                      print('KEYS',list(d)[:30])
                      for k,v in list(d.items())[:4]:
                          if isinstance(v,list): print('LIST',k,'LEN',len(v),'FIRST',json.dumps(v[:1],ensure_ascii=False)[:1100])
                          elif isinstance(v,dict): print('DICT',k,'KEYS',list(v)[:12],'FIRST',json.dumps(list(v.items())[:1],ensure_ascii=False)[:800])
                          else:print('VALUE',k,str(v)[:200])
                  elif isinstance(d,list):print('LIST_LEN',len(d),'FIRST',json.dumps(d[:1],ensure_ascii=False)[:1100])
          m=z.read('results/manifest.json')
          assert hashlib.sha256(m).hexdigest()=='5f4fb0ceccc5a64aa7411cc287715e6fa9a39d593da6713910920a3fda67c613'
          d=z.read('results/device_stress_design.json')
          assert hashlib.sha256(d).hexdigest()=='76763a87569d885705dccc54cbd72e878f7a711cbb5343fbfee4517caf2482e6'
          print('R1_ARCHIVE_SHA_AND_DESIGN_PASS')
          PY

      - name: Inspect exact B1 R1 event schema before scoring
        run: |
          python - <<'PY'
          import zipfile,json
          with zipfile.ZipFile('research/uji_core/evidence.zip') as z:
              m=json.loads(z.read('results/manifest.json'))
              b=[e for e in m['episodes'] if e['building']==1]
              print('B1_EPISODES',len(b),'BY_FLOOR',[(f,sum(e['floor']==f for e in b)) for f in range(4)])
              for e in [b[0],b[10],b[20],b[30]]:
                  print('B1_EPISODE',json.dumps({k:(v[:3] if isinstance(v,list) else v) for k,v in e.items()},ensure_ascii=False))
              d=json.loads(z.read('results/device_stress_design.json'))
              print('DEVICE_EVENTS',len(d['events']),'FIRST',json.dumps(d['events'][:2],ensure_ascii=False)[:5500])
              w=json.loads(z.read('results/wknn_parameters.json'))
              print('WKNN_SELECTION',json.dumps(w['selected'],ensure_ascii=False)[:3000]);print('WKNN_CANDIDATES',w['candidates'])
          PY

      - name: Identify existing complete WKNN scores without rerunning them
        run: |
          python - <<'PY'
          import csv,io,zipfile,collections,json
          with zipfile.ZipFile('research/uji_core/evidence.zip') as z:
              for name in ['results/wknn_events.csv','results/device_stress_events.csv','results/legacy_wknn_audit.json']:
                  raw=z.read(name)
                  if name.endswith('.csv'):
                      rr=list(csv.DictReader(io.StringIO(raw.decode())))
                      print('OLD_ROWS',name,len(rr),'HEAD',rr[0] if rr else None)
                      print('FREQ',collections.Counter((r.get('building'),r.get('floor'),r.get('K'),r.get('split')) for r in rr).most_common(8))
                  else:
                      d=json.loads(raw); print('LEGACY_KEYS',list(d),'FIRST',json.dumps(d.get('events',[])[:1])[:2000])
          PY

      - name: Aggregate existing B1 400-event strong comparators, do not rescore
        run: |
          python - <<'PY'
          import csv,io,zipfile,collections,statistics
          with zipfile.ZipFile('research/uji_core/evidence.zip') as z:
              sources=[('official','results/wknn_events.csv','draw'),('phone','results/device_stress_events.csv','seed')]
              for label,fn,index in sources:
                  rr=list(csv.DictReader(io.StringIO(z.read(fn).decode())))
                  rr=[r for r in rr if int(r['building'])==1]
                  methods=sorted(set(r['method'] for r in rr));print('REGIME',label,'METHODS',methods,'ROWS',len(rr))
                  for m in methods:
                      print('METHOD',label,m)
                      for k in (1,3,5,10,20):
                          cells=[]
                          for f in range(4):
                              a=[float(r['mde']) for r in rr if int(r['floor'])==f and int(r['K'])==k and r['method']==m]
                              assert len(a)==10,(label,f,k,m,len(a))
                              cells.append(round(statistics.mean(a),5))
                          print('K',k,'FLOORS',cells,'EQUAL_FLOOR',round(statistics.mean(cells),5))
          PY
