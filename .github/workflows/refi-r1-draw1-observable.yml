name: R1 draw1 matched five-budget replication
on:
  push:
    branches: [research/uji-core-refactor-20261101]
    paths: ['.github/workflows/refi-r1-draw1-observable.yml']
permissions: {contents: read}
env: {OPENBLAS_NUM_THREADS: '1', OMP_NUM_THREADS: '1', MKL_NUM_THREADS: '1', PYTHONUNBUFFERED: '1'}
jobs:
  maps:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: {reg: [official, phone], f: [0,1,2,3]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Locked UCI input, frozen learners, draw 1, no B1 tuning
        run: |
          python -m pip install packaging numpy==2.3.5 scipy==1.16.3 pandas==2.2.3 pypmc==1.2.6
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          curl -fsSL --retry 3 --max-time 180 https://archive.ics.uci.edu/static/public/310/ujiindoorloc.zip -o /tmp/uji.zip; unzip -q /tmp/uji.zip -d /tmp/uji
          d=$(dirname "$(find /tmp/uji -name trainingData.csv | head -1)")
          python -m research.r1_single_scan.full_draw0.next_draw "$d" /tmp/rep '${{ matrix.reg }}' '${{ matrix.f }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'draw1-${{ matrix.reg }}-F${{ matrix.f }}', path: /tmp/rep/, if-no-files-found: warn}
  archive:
    if: always() && github.repository == 'Amanon-666/law' && github.ref == 'refs/heads/research/uji-core-refactor-20261101'
    needs: maps
    permissions: {contents: write, actions: read}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: 'research/uji-core-refactor-20261101'}
      - uses: actions/download-artifact@v4
        with: {pattern: 'draw1-*', path: /tmp/inputs}
      - name: Save this run only, never overwrite old receipts
        run: |
          set -euo pipefail
          p=research/r1_single_scan/full_draw0/results/${{ github.run_id }}-${{ github.run_attempt }}; test ! -e "$p"; mkdir -p "$p"; cp -r /tmp/inputs/draw1-* "$p/"
          cd "$p"; echo '${{ github.sha }}' > EXECUTED_COMMIT; find . -type f ! -name SHA256SUMS -print0|sort -z|xargs -0 sha256sum > SHA256SUMS; cd - >/dev/null
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'; git add -f "$p"; git commit -m 'Archive original draw1 five-budget comparison rows, quality and any failures'; git pull --rebase origin research/uji-core-refactor-20261101; git push origin HEAD:refs/heads/research/uji-core-refactor-20261101; echo "OUT=$p" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with: {name: R1-draw1-frozen-rows, path: '${{ env.OUT }}', if-no-files-found: error}
