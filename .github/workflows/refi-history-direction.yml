name: ReFi independent history contrasts
on:
  push:
    branches: [research/uji-core-refactor-20261101]
    paths: ['.github/workflows/refi-history-direction.yml','research/uji_core/round2/route/minho/history_direction.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 scipy==1.16.3
      - name: Chronological source fit and two development transfers
        run: |
          curl -fsSL --retry 3 --max-time 250 'https://zenodo.org/records/6646008/files/UM_DSI_DB_v1.0.0_lite.zip?download=1' -o /tmp/minho.zip
          python -m research.uji_core.round2.route.minho.history_direction /tmp/minho.zip /tmp/histdir
      - uses: actions/upload-artifact@v4
        with:
          name: minho-direction
          path: /tmp/histdir
          retention-days: 30
