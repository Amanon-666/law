name: ReFi B1 variance deletion
on:
  push:
    branches: [research/uji-core-refactor-20261101]
    paths: ['.github/workflows/refi-variance-ablation.yml','research/uji_core/round2/paper_replay/variance_ablation.py']
permissions:
  contents: read
jobs:
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        floor: [1,2]
        seed: [0,1,2]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original numerical components
        run: |
          python -m pip install packaging==25.0 numpy==2.3.5 scipy==1.16.3 pandas==2.2.3 pypmc==1.2.6
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
      - name: Reconstruct one support posterior and score both readouts
        run: |
          curl -fsSL --retry 3 --max-time 150 https://archive.ics.uci.edu/static/public/310/ujiindoorloc.zip -o /tmp/uji.zip
          unzip -q /tmp/uji.zip -d /tmp/uji
          d=$(dirname "$(find /tmp/uji -name trainingData.csv | head -1)")
          python -m research.uji_core.round2.paper_replay.variance_ablation "$d" /tmp/var ${{ matrix.floor }} ${{ matrix.seed }}
      - uses: actions/upload-artifact@v4
        with:
          name: gp-B1F${{ matrix.floor }}-${{ matrix.seed }}
          path: /tmp/var
          retention-days: 30
  summary:
    needs: paired
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: gp-B1F*
          path: /tmp/all
          merge-multiple: true
      - name: Require all six successful fits; compact only scores, events and predictions
        run: |
          python - <<'PY'
          import json,pathlib,statistics,shutil
          a=pathlib.Path('/tmp/all'); o=pathlib.Path('/tmp/report'); o.mkdir()
          events=[json.loads(f.read_text()) for f in sorted(a.glob('*.json'))]; assert len(events)==6 and len({e['event'] for e in events})==6
          scores={sp:{v:statistics.mean(e['scores'][sp][v] for e in events) for v in ('full','flat','flat_minus_full')} for sp in ('internal','official')}
          parity=all(abs(scores[s]['full']-v)<=.00051 for s,v in [('internal',11.102),('official',11.787)])
          r={'macro':scores,'matches_printed_GP_both':parity,'events':events,'scope':'Six B1 development calibration events; not an independent building test. The two DeepSets means are published references, not predictions from this run.'}
          (o/'summary.json').write_text(json.dumps(r,indent=2)+'\n'); print('SCORES',scores,'PAPER_PARITY',parity)
          for f in a.glob('*_pred.npz'): shutil.copy(f,o)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gp-six-paired
          path: /tmp/report
          retention-days: 30
