name: Verify original R1 draw0 five-budget curves
on:
  push:
    branches: [research/uji-core-refactor-20261101]
    paths: ['.github/workflows/refi-r1-observable-check.yml']
permissions: {contents: read, actions: read}
env: {OPENBLAS_NUM_THREADS: '1'}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy==2.3.5
      - name: Verify all coordinates against original row IDs, freeze source-only voters, and recalculate MDE/P90/uncertainty
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r1pack/rows
          cd /tmp/r1pack
          for z in $(seq 1 200); do
            id=$(gh api repos/Amanon-666/law/actions/runs/41561930039/artifacts --jq '.artifacts[] | select(.name=="r1-draw0-five-budgets-rows") | .id'); if test -n "$id"; then break; fi
            sleep 15
          done
          test -n "$id"
          gh api repos/Amanon-666/law/actions/artifacts/$id/zip > rows.zip; h=$(gh api repos/Amanon-666/law/actions/artifacts/$id --jq .digest |cut -d: -f2); echo "$h  rows.zip" | sha256sum -c; unzip -q rows.zip -d rows; (cd rows; sha256sum -c SHA256SUMS; test "$(cat EXECUTED_COMMIT)" = a94e26f2b96a7dad24e2303801a4f41b9d8e4bf4); rm rows.zip
          gh api repos/Amanon-666/law/actions/artifacts/13193457399/zip > old-high.zip; gh api repos/Amanon-666/law/actions/artifacts/13144208334/zip > old-low.zip
          cp "$GITHUB_WORKSPACE"/research/r1_single_scan/full_draw0/{verify.py,PROTOCOL.md,WKNN_SOURCE_LOCK.json,run.py} .; cp "$GITHUB_WORKSPACE"/research/uji_core/evidence.zip .
          python verify.py rows evidence.zip old-high.zip old-low.zip summary.json
          python - <<'PY'
          import json
          s=json.load(open('summary.json')); assert s['source_selected']==json.load(open('WKNN_SOURCE_LOCK.json'))['selected']; print(s['missing']); print('VI warnings, do not discard:',len(s['warnings']))
          for reg,cv in s['curves'].items():
            for k,m in cv.items():print(reg,k,[(a,round(m[a][0],3)) for a in ('gp','seven','nonlinear','gp_map','seven_map','nonlinear_map','empirical_source_tuned')]);
          PY
          printf '%s\n' 'Offline, after unpacking: python verify.py rows evidence.zip old-high.zip old-low.zip my-summary.json (NumPy). All coordinates are UJI native U, draw 0 only, not independent buildings. See PROTOCOL.md; never average successful-only cells.' > README.txt
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with: {name: R1-draw0-independent-observable-replication, path: /tmp/r1pack, if-no-files-found: error}
