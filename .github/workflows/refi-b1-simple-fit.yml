name: ReFi simple same-source mean reference
on:
  push:
    branches: [research/uji-core-refactor-20261101]
    paths: ['.github/workflows/refi-b1-simple-fit.yml']
permissions: {contents: read}
env: {OPENBLAS_NUM_THREADS: '1', OMP_NUM_THREADS: '1', MKL_NUM_THREADS: '1'}
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          python -m pip install packaging numpy==2.3.5 scipy==1.16.3 pandas==2.2.3 pypmc==1.2.6
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          curl -fsSL --retry 3 --max-time 180 https://archive.ics.uci.edu/static/public/310/ujiindoorloc.zip -o /tmp/uji.zip
          unzip -q /tmp/uji.zip -d /tmp/uji
          d=$(dirname "$(find /tmp/uji -name trainingData.csv | head -1)")
          python -m research.uji_core.round2.paper_replay.limit_study.linear_reference train "$d" /tmp/train
      - uses: actions/upload-artifact@v4
        with:
          name: affine-source
          path: |
            /tmp/train/operator.pt
            /tmp/train/simple.json
            /tmp/train/freeze.json
  score:
    needs: train
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: {f: [1,2], seed: [0,1,2]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/download-artifact@v4
        with: {name: affine-source, path: /tmp/train}
      - run: |
          python -m pip install packaging numpy==2.3.5 scipy==1.16.3 pandas==2.2.3 pypmc==1.2.6
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          curl -fsSL --retry 3 --max-time 180 https://archive.ics.uci.edu/static/public/310/ujiindoorloc.zip -o /tmp/uji.zip
          unzip -q /tmp/uji.zip -d /tmp/uji
          d=$(dirname "$(find /tmp/uji -name trainingData.csv | head -1)")
          python -m research.uji_core.round2.paper_replay.limit_study.linear_reference score "$d" /tmp/train /tmp/linear ${{ matrix.f }} ${{ matrix.seed }}
      - uses: actions/upload-artifact@v4
        with: {name: 'affine-F${{ matrix.f }}-${{ matrix.seed }}', path: /tmp/linear}
  collect:
    needs: score
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: 'affine-F*', path: /tmp/linear, merge-multiple: true}
      - uses: actions/download-artifact@v4
        with: {name: affine-source, path: /tmp/linear/source}
      - run: |
          python - <<'PY'
          import json,pathlib,statistics
          d=pathlib.Path('/tmp/linear');E=[json.loads(p.read_text()) for p in sorted(d.glob('*.json'))];assert {e['event'] for e in E}=={f'B1F{f}_{s}' for f in (1,2) for s in range(3)};res={s:{a:statistics.mean(e['metrics'][a][s]['mde'] for e in E) for a in E[0]['metrics']} for s in ['internal','official']};(d/'affine_summary.json').write_text(json.dumps(dict(mde=res,events=E),indent=2));print(res)
          PY
      - uses: actions/upload-artifact@v4
        with: {name: affine-six-with-source, path: /tmp/linear}
