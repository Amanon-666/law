name: ReFi locked R1 F0 draw0 K5-10-20 VI bridge
# Only one frozen diagnostic shard, no reopening any confirmation holdouts.
on:
  push:
    branches: [research/uji-core-refactor-20261101]
    paths: ['.github/workflows/refi-r1-highk-bridge.yml']
permissions: {contents: read, actions: read}
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONUNBUFFERED: '1'
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install pinned numerical backend (no model changes)
        run: |
          python -m pip install packaging numpy==2.3.5 scipy==1.16.3 pandas==2.2.3 pypmc==1.2.6
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          python -m py_compile research/r1_single_scan/{score,highk_bridge,verify_highk_bridge}.py
      - name: Fetch original UCI CSV and verify immutable hashes in scorer
        run: |
          curl -fsSL --retry 3 --max-time 180 https://archive.ics.uci.edu/static/public/310/ujiindoorloc.zip -o /tmp/uji.zip
          unzip -q /tmp/uji.zip -d /tmp/uji
          d=$(dirname "$(find /tmp/uji -name trainingData.csv | head -1)")
          test -f "$d/validationData.csv"
          echo "DATA_DIR=$d" >> "$GITHUB_ENV"
      - name: Run only F0 official draw0 K5 K10 K20 VI500
        run: |
          mkdir -p /tmp/r1vi
          python -m research.r1_single_scan.highk_bridge "$DATA_DIR" /tmp/r1vi --floor 0 --regime official --draw 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r1-F0-draw0-VI500-raw-partial-or-complete
          path: /tmp/r1vi/
          if-no-files-found: warn
  verify:
    needs: score
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install only offline verifier dependency
        run: python -m pip install numpy==2.3.5
      - uses: actions/download-artifact@v4
        with:
          name: r1-F0-draw0-VI500-raw-partial-or-complete
          path: /tmp/r1vi
      - name: Download previously frozen K5 M-PMC output read-only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/oldr1
          gh api repos/Amanon-666/law/actions/artifacts/13141727942/zip > /tmp/oldr1.zip
          echo '1962c99dd2b87d800d3d1f0afd11990058a0c3cc425b4cf56c52170e767f30e2  /tmp/oldr1.zip' | sha256sum -c
          unzip -q /tmp/oldr1.zip -d /tmp/oldr1
          test -s /tmp/oldr1/official_F0_0.json
          test -s /tmp/oldr1/official_F0_0.npz
      - name: Independently recompute MDE P90 and check exact matched K5 bridge
        run: |
          python -m research.r1_single_scan.verify_highk_bridge /tmp/r1vi /tmp/oldr1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r1-F0-draw0-VI500-audit
          path: /tmp/r1vi/
          if-no-files-found: warn
