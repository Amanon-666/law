name: ReFi fixed learned map x target density
on:
  push:
    branches: [research/uji-core-refactor-20261101]
    paths: ['.github/workflows/refi-frozen-mean-density.yml','research/uji_core/round2/paper_replay/limit_study/density_cross.py']
permissions: {contents: read, actions: read}
jobs:
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: {f: [1,2], sd: [0,1,2]}
    env: {OPENBLAS_NUM_THREADS: '1', OMP_NUM_THREADS: '1', MKL_NUM_THREADS: '1'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          gh api repos/Amanon-666/law/actions/artifacts/13110009567/zip >/tmp/affine.zip
          gh api repos/Amanon-666/law/actions/artifacts/13109733236/zip >/tmp/dense.zip
          python -m pip install packaging numpy==2.3.5 scipy==1.16.3 pandas==2.2.3 pypmc==1.2.6
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          curl -fsSL --retry 3 --max-time 180 https://archive.ics.uci.edu/static/public/310/ujiindoorloc.zip -o /tmp/uji.zip
          unzip -q /tmp/uji.zip -d /tmp/uji
          d=$(dirname "$(find /tmp/uji -name trainingData.csv | head -1)")
          python -m research.uji_core.round2.paper_replay.limit_study.density_cross "$d" /tmp/affine.zip /tmp/dense.zip /tmp/out ${{ matrix.f }} ${{ matrix.sd }}
          rm -r /tmp/out/working
      - uses: actions/upload-artifact@v4
        with: {name: 'cross-F${{ matrix.f }}-${{ matrix.sd }}', path: /tmp/out}
  combine:
    needs: paired
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: 'cross-F*', path: /tmp/results, merge-multiple: true}
      - run: |
          python - <<'PY'
          import json,pathlib,statistics
          p=pathlib.Path('/tmp/results');rows=[json.loads(f.read_text()) for f in sorted(p.glob('*.json'))];assert {e['event'] for e in rows}=={f'B1F{f}_{s}' for f in (1,2) for s in range(3)};results={sp:{k:statistics.mean(r['scores'][sp][k] for r in rows) for k in rows[0]['scores'][sp]} for sp in ['internal','official']};(p/'cross_summary.json').write_text(json.dumps({'summary':results,'events':rows},indent=2));print(results)
          PY
      - uses: actions/upload-artifact@v4
        with: {name: cross-budget, path: /tmp/results}
