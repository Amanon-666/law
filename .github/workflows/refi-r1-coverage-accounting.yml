name: R1 ten draws coverage accounting without refitting
on:
  push:
    branches: [research/uji-core-refactor-20261101]
    paths: ['.github/workflows/refi-r1-coverage-accounting.yml']
permissions: {actions: read, contents: read}
env: {OPENBLAS_NUM_THREADS: '1'}
jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          python -m pip install numpy==2.3.5 pandas==2.2.3
          curl -fsSL --retry 3 --max-time 180 https://archive.ics.uci.edu/static/public/310/ujiindoorloc.zip -o /tmp/uci.zip; unzip -q /tmp/uci.zip -d /tmp/uci
          d=$(dirname "$(find /tmp/uci -name trainingData.csv|head -1)"); python research/r1_single_scan/full_draw0/geometry_check.py make "$d" research/uji_core/evidence.zip /tmp/geo
          cp research/r1_single_scan/full_draw0/{geometry_check.py,GEOMETRY_PROTOCOL.md} /tmp/geo/
      - uses: actions/upload-artifact@v4
        with: {name: r1-geometry-distances-only, path: /tmp/geo, if-no-files-found: error}
  decompose:
    needs: geometry
    if: github.repository == 'Amanon-666/law' && github.ref == 'refs/heads/research/uji-core-refactor-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    permissions: {actions: read, contents: write}
    steps:
      - uses: actions/checkout@v4
        with: {ref: research/uji-core-refactor-20261101}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy==2.3.5
      - uses: actions/download-artifact@v4
        with: {name: r1-geometry-distances-only, path: /tmp/geo}
      - name: Verify independent ten-draw receipts before descriptive accounting
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          mkdir -p /tmp/del; cd /tmp/del
          for i in $(seq 1 270); do
            id=$(gh api repos/Amanon-666/law/actions/runs/41563781076/artifacts --jq '.artifacts[]|select(.name=="R1-original-ten-independent-pack")|.id'); if test -n "$id"; then break; fi; sleep 15
          done
          test -n "$id"; h=$(gh api repos/Amanon-666/law/actions/artifacts/$id --jq .digest|cut -d: -f2); gh api repos/Amanon-666/law/actions/artifacts/$id/zip > /tmp/ten.zip; echo "$h  /tmp/ten.zip"|sha256sum -c; unzip -q /tmp/ten.zip; sha256sum -c SHA256SUMS
          python /tmp/geo/geometry_check.py analyze rows draw1 remaining /tmp/geo verified/ten.json /tmp/geo/decomposition.json
          cd "$GITHUB_WORKSPACE"; p=research/r1_single_scan/full_draw0/coverage/${{ github.run_id }}-${{ github.run_attempt }}; mkdir -p "$p"; cp /tmp/geo/* "$p/"; git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'; git add -f "$p"; git commit -m 'Archive secondary nearest-anchor coverage decomposition without fitting or replacing an estimator'; git pull --rebase origin research/uji-core-refactor-20261101; git push origin HEAD:refs/heads/research/uji-core-refactor-20261101
      - uses: actions/upload-artifact@v4
        with: {name: R1-ten-coverage-accounting, path: /tmp/geo, if-no-files-found: error}
