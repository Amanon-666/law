name: ReFi v026 manuscript bridge
on:
  push:
    branches: [research/uji-core-refactor-20261101]
    paths: ['.github/workflows/refi-v026-replay.yml', 'research/uji_core/round2/paper_replay/replay.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 scipy==1.16.3 pandas==2.2.3
      - name: Download only the UCI cross-floor corpus
        run: |
          curl -fsSL --retry 3 --max-time 150 https://archive.ics.uci.edu/static/public/310/ujiindoorloc.zip -o /tmp/uji.zip
          unzip -q /tmp/uji.zip -d /tmp/uji
          d=$(dirname "$(find /tmp/uji -name trainingData.csv | head -1)")
          python -m research.uji_core.round2.paper_replay.replay "$d" /tmp/v026
      - uses: actions/upload-artifact@v4
        with:
          name: manuscript-replay
          path: /tmp/v026
          retention-days: 30
