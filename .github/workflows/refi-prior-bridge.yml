name: ReFi prior and tie bridge
on:
  push:
    branches: [research/uji-core-refactor-20261101]
    paths: ['.github/workflows/refi-prior-bridge.yml','research/uji_core/round2/paper_replay/prior_bridge.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        numpy: ['1.26.4','2.3.5']
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy==${{ matrix.numpy }}' scipy==1.15.3 pandas==2.2.3
      - name: Original reader and coordinate priors
        run: |
          curl -fsSL --retry 3 --max-time 150 https://archive.ics.uci.edu/static/public/310/ujiindoorloc.zip -o /tmp/uji.zip
          unzip -q /tmp/uji.zip -d /tmp/uji
          d=$(dirname "$(find /tmp/uji -name trainingData.csv | head -1)")
          python -m research.uji_core.round2.paper_replay.prior_bridge "$d" /tmp/bridge
      - uses: actions/upload-artifact@v4
        with:
          name: prior-bridge-${{ matrix.numpy }}
          path: /tmp/bridge
          retention-days: 30
