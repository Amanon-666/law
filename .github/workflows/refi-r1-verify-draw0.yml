name: Independently verify locked R1 draw-0 eight shards
on:
  push:
    branches: [research/uji-core-refactor-20261101]
    paths: ['.github/workflows/refi-r1-verify-draw0.yml']
permissions: {actions: read, contents: read}
env:
  OPENBLAS_NUM_THREADS: '1'
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install NumPy for read-only verification
        run: python -m pip install numpy==2.3.5
      - name: Check fixed artifact and run all 24 score checks without model fitting
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/refi-r1-audit/shards
          gh api repos/Amanon-666/law/actions/artifacts/13143387577/zip > /tmp/refi-r1-audit/r1-draw0-source.zip
          echo 'b3cf7f74b24961aed495d12f79a0cd4243a721ff7f8d4f102a84fdec994c673f  /tmp/refi-r1-audit/r1-draw0-source.zip' | sha256sum -c
          unzip -qo /tmp/refi-r1-audit/r1-draw0-source.zip -d /tmp/refi-r1-audit/shards
          python -m research.r1_single_scan.verify_locked /tmp/refi-r1-audit/shards > /tmp/refi-r1-audit/verify.json
          python -m research.r1_single_scan.analyze_locked /tmp/refi-r1-audit/shards > /tmp/refi-r1-audit/analysis.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/refi-r1-audit/verify.json'))
          a=json.load(open('/tmp/refi-r1-audit/analysis.json'))
          assert r['expected']==8 and r['verified']==8 and not r['missing'] and not r['invalid']
          assert a['verified_shards']==8 and a['verified_cells']==24
          print('All eight original R1 draw-0 shards / 24 K-cells verified.')
          for reg,section in a['regimes'].items():
              for k,v in section['results'].items():
                  print(reg,k,{m:round(x,4) for m,x in v['mde'].items()})
          PY
          sha256sum /tmp/refi-r1-audit/{r1-draw0-source.zip,verify.json,analysis.json} > /tmp/refi-r1-audit/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r1-draw0-independent-verification
          path: |
            /tmp/refi-r1-audit/r1-draw0-source.zip
            /tmp/refi-r1-audit/verify.json
            /tmp/refi-r1-audit/analysis.json
            /tmp/refi-r1-audit/SHA256SUMS
          if-no-files-found: warn
          retention-days: 90
