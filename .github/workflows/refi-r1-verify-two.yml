name: Verify R1 two fixed draws and identical-map comparisons
on:
  push:
    branches: [research/uji-core-refactor-20261101]
    paths: ['.github/workflows/refi-r1-verify-two.yml']
permissions: {contents: read, actions: read}
env: {OPENBLAS_NUM_THREADS: '1'}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy==2.3.5
      - name: Only open registered runs, check all published data hashes, and verify predictions without model dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r1two/draw1; cd /tmp/r1two
          gh api repos/Amanon-666/law/actions/artifacts/13198161263/zip > /tmp/d0.zip
          echo '310d72d2d6d8567724b3c4e20d2262e716b1b6c367a03c5d11787d27343adff1  /tmp/d0.zip' | sha256sum -c; unzip -q /tmp/d0.zip; sha256sum -c SHA256SUMS; mv SHA256SUMS DRAW0_CHECKSUMS
          for i in $(seq 1 200); do
            id=$(gh api repos/Amanon-666/law/actions/runs/41562658591/artifacts --jq '.artifacts[] | select(.name=="R1-draw1-frozen-rows") | .id'); if test -n "$id"; then break; fi; sleep 15
          done
          test -n "$id"; hash=$(gh api repos/Amanon-666/law/actions/artifacts/$id --jq .digest|cut -d: -f2); gh api repos/Amanon-666/law/actions/artifacts/$id/zip > /tmp/d1.zip; echo "$hash  /tmp/d1.zip" | sha256sum -c; unzip -q /tmp/d1.zip -d draw1; (cd draw1; sha256sum -c SHA256SUMS; test "$(cat EXECUTED_COMMIT)" = 46857f13bdaa4a6e96071f00503705ae47f5b364)
          cp "$GITHUB_WORKSPACE"/research/r1_single_scan/full_draw0/{verify_two.py,next_draw.py,DRAW1_PROTOCOL.md} .
          python verify_two.py rows draw1 evidence.zip WKNN_SOURCE_LOCK.json joint.json
          python - <<'PY'
          import json
          j=json.load(open('joint.json')); print('all cells / 80',j['coverage'],'excluded with reasons',j['missing']); print('numerical warning arm count',len(j['numerical_warnings']));
          for r,v in j['curves'].items():
            for k,w in v.items(): print(r,k,{a:round(w[a][0],4) for a in ['gp','seven','nonlinear','empirical','fixed_half','gp_map','seven_map','nonlinear_map']})
          PY
          printf '%s\n' 'Offline: python verify_two.py rows draw1 evidence.zip WKNN_SOURCE_LOCK.json my-joint.json (NumPy). Re-read original draw0 numerical bridge independently: python verify.py rows evidence.zip old-high.zip old-low.zip my-first.json. MDE/P90 in original UJI U, not metres. Two of ten original support draws, one building, same queries across draws; warnings and missing cells always retained.' > READ_ME_TWO_DRAWS.txt
          find . -type f ! -name SHA256SUMS -print0|sort -z|xargs -0 sha256sum > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with: {name: R1-two-draw-replication, path: /tmp/r1two, if-no-files-found: error}
