name: Minho R1 ordering diagnostic
on:
  push:
    branches:
      - research/uji-core-refactor-20261101
    paths:
      - .github/workflows/minho-r1-order.yml
      - research/uji_core/round2/route/minho/order_separability.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  minho:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install NumPy
        run: python -m pip install numpy
      - name: Download and verify published raw source
        run: |
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 360 \
            'https://zenodo.org/records/6646008/files/UM_DSI_DB_v1.0.0_lite.zip?download=1' \
            --output /tmp/UM_DSI_DB_v1.0.0_lite.zip
          echo '4c15884cb7edcd2c602ec5d567ddd8a8  /tmp/UM_DSI_DB_v1.0.0_lite.zip' | md5sum -c -
      - name: Run R1-only paired source check
        run: |
          python research/uji_core/round2/route/minho/order_separability.py \
            /tmp/UM_DSI_DB_v1.0.0_lite.zip /tmp/order_separability.json
          cat /tmp/order_separability.json
