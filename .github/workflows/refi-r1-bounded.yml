name: ReFi R1 frozen three-history K1-3-5 bounded score
# Read root-level operator.pt from source-v1.zip; immutable frozen bytes.
on:
  push:
    branches: [research/uji-core-refactor-20261101]
    paths: ['.github/workflows/refi-r1-bounded.yml']
permissions: {contents: read}
env: {OPENBLAS_NUM_THREADS: '1', OMP_NUM_THREADS: '1', MKL_NUM_THREADS: '1', PYTHONUNBUFFERED: '1'}
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        floor: [0,1,2,3]
        regime: [official, phone]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install pinned computational environment
        run: |
          python -m pip install packaging numpy==2.3.5 scipy==1.16.3 pandas==2.2.3 pypmc==1.2.6
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          python -m py_compile research/r1_single_scan/score.py
      - name: Fetch original UCI archive with immutable CSV checks
        run: |
          curl -fsSL --retry 3 --max-time 180 https://archive.ics.uci.edu/static/public/310/ujiindoorloc.zip -o /tmp/uji.zip
          unzip -q /tmp/uji.zip -d /tmp/uji
          d=$(dirname "$(find /tmp/uji -name trainingData.csv | head -1)")
          test -f "$d/validationData.csv"
          echo "DATA_DIR=$d" >> "$GITHUB_ENV"
      - name: Score frozen three-source GP and two source-trained rules
        run: |
          python -m research.r1_single_scan.score "$DATA_DIR" /tmp/r1 ${{ matrix.floor }} ${{ matrix.regime }} --draw 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r1-partial-${{ matrix.regime }}-F${{ matrix.floor }}
          path: /tmp/r1
          if-no-files-found: warn
  collect:
    needs: score
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: r1-partial-*
          path: /tmp/r1
          merge-multiple: true
      - name: Print exact coverage, no successful-only summary
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('/tmp/r1');found=sorted(x.stem for x in p.glob('*.json'))
          expected=sorted(f'{regime}_F{f}_0' for f in range(4) for regime in ('official','phone'))
          print('EXPECTED',expected,'FOUND',found,'MISSING',sorted(set(expected)-set(found)))
          d=[json.loads(x.read_text()) for x in p.glob('*.json')]
          for x in d:
              print(x['regime'],x['floor'],'query_rows',x['query_count'],'historical_sources',x['historical_floor_ids'])
              for r in x['results']:
                  print('K',r['K'],'APs',r['ap_count'],'MDE', {k:round(v['mde'],4) for k,v in r['metrics'].items()},'WKNN',r['wknn_archived'])
          (p/'COVERAGE.json').write_text(json.dumps(dict(expected=expected,found=found,missing=sorted(set(expected)-set(found))),indent=2))
          assert len(found)==len(expected),'Not a complete fixed shard; preserve successes and explicit missing entries'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r1-partial-fixed-draw0-comparison
          path: /tmp/r1
          if-no-files-found: warn
