name: ReFi B1 learned mean and limits
on:
  push:
    branches: [research/uji-core-refactor-20261101]
    paths: ['.github/workflows/refi-b1-history-limit.yml']
permissions:
  contents: read
concurrency:
  group: b1-mean-only-nov02
  cancel-in-progress: false
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          python -m pip install packaging numpy==2.3.5 scipy==1.16.3 pandas==2.2.3 pypmc==1.2.6
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          curl -fsSL --retry 3 --max-time 180 https://archive.ics.uci.edu/static/public/310/ujiindoorloc.zip -o /tmp/uji.zip
          unzip -q /tmp/uji.zip -d /tmp/uji
          d=$(dirname "$(find /tmp/uji -name trainingData.csv | head -1)")
          python -m research.uji_core.round2.paper_replay.limit_study.source "$d" /tmp/source
      - uses: actions/upload-artifact@v4
        with:
          name: source-v1
          path: |
            /tmp/source/operator.pt
            /tmp/source/freeze.json
            /tmp/source/simple.json
  score:
    needs: fit
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: {f: [1,2], seed: [0,1,2]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/download-artifact@v4
        with: {name: source-v1, path: /tmp/source}
      - run: |
          python -m pip install packaging numpy==2.3.5 scipy==1.16.3 pandas==2.2.3 pypmc==1.2.6
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          curl -fsSL --retry 3 --max-time 180 https://archive.ics.uci.edu/static/public/310/ujiindoorloc.zip -o /tmp/uji.zip
          unzip -q /tmp/uji.zip -d /tmp/uji
          d=$(dirname "$(find /tmp/uji -name trainingData.csv | head -1)")
          python -m research.uji_core.round2.paper_replay.limit_study.paired "$d" /tmp/source /tmp/scored ${{ matrix.f }} ${{ matrix.seed }}
      - uses: actions/upload-artifact@v4
        with: {name: 'paired-F${{ matrix.f }}-s${{ matrix.seed }}', path: /tmp/scored}
  summary:
    needs: score
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: 'paired-F*', path: /tmp/results, merge-multiple: true}
      - run: |
          python - <<'PY'
          import json,statistics,itertools,pathlib
          r=pathlib.Path('/tmp/results');ev=[json.loads(p.read_text()) for p in sorted(r.glob('*.json'))];assert {e['event'] for e in ev}=={f'B1F{f}_{s}' for f in [1,2] for s in range(3)} and len(ev)==6 and len(set(e['source'] for e in ev))==1
          m={s:{a:statistics.mean(e['metrics'][a][s]['mde'] for e in ev) for a in ev[0]['metrics']} for s in ['internal','official']};d={};
          for s in m:
            d[s]={}
            for a in m[s]:
              v=[e['metrics']['mean_only'][s]['mde']-e['metrics'][a][s]['mde'] for e in ev];bs=sorted(sum(v[i] for i in ids)/6 for p in itertools.product(range(3),repeat=3) for q in itertools.product(range(3,6),repeat=3) for ids in [p+q]);d[s][a]={'delta':statistics.mean(v),'interval':[bs[18],bs[710]],'wins':sum(x<0 for x in v)}
          result={'mde':m,'mean_only_minus_controls':d,'events':ev,'clear_screen':m['internal']['mean_only']<=10.12795 and m['official']['mean_only']<=11.00670 and all(d[s]['coupled_full']['interval'][1]<0 for s in d)};print(json.dumps({k:v for k,v in result.items() if k!='events'}));(r/'paired_summary.json').write_text(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with: {name: all-b1-models, path: /tmp/results}
