name: ReFi co-detection intervention
on:
  push:
    branches: [research/uji-core-refactor-20261101]
    paths: ['.github/workflows/refi-count-intervention.yml','research/uji_core/round2/paper_replay/limit_study/co_detection.py']
permissions: {contents: read, actions: read}
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env: {OPENBLAS_NUM_THREADS: '1'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with:
          run-id: 41370648408
          github-token: ${{ github.token }}
          pattern: gp-B1F*
          path: /tmp/fields
          merge-multiple: true
      - run: |
          python -m pip install numpy==2.3.5 scipy==1.16.3 pandas==2.2.3
          curl -fsSL --retry 3 --max-time 180 https://archive.ics.uci.edu/static/public/310/ujiindoorloc.zip -o /tmp/uji.zip
          unzip -q /tmp/uji.zip -d /tmp/uji
          d=$(dirname "$(find /tmp/uji -name trainingData.csv | head -1)")
          python -m research.uji_core.round2.paper_replay.limit_study.co_detection "$d" /tmp/fields /tmp/res
      - uses: actions/upload-artifact@v4
        with: {name: co-detection, path: /tmp/res}
