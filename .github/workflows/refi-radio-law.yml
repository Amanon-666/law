name: ReFi single propagation law
on:
  push:
    branches: [research/uji-core-refactor-20261101]
    paths: ['.github/workflows/refi-radio-law.yml','research/uji_core/round2/paper_replay/radio_kernel.py']
permissions:
  contents: read
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 scipy==1.16.3 pandas==2.2.3
      - name: Select only on other buildings; score six manuscript events
        run: |
          curl -fsSL --retry 3 --max-time 160 https://archive.ics.uci.edu/static/public/310/ujiindoorloc.zip -o /tmp/uji.zip
          unzip -q /tmp/uji.zip -d /tmp/uji
          d=$(dirname "$(find /tmp/uji -name trainingData.csv | head -1)")
          python -m research.uji_core.round2.paper_replay.radio_kernel "$d" /tmp/radio
      - uses: actions/upload-artifact@v4
        with:
          name: radio-propagation
          path: /tmp/radio
          retention-days: 30
