name: R1 original ten support orders, fixed remaining rows
on:
  push:
    branches: [research/uji-core-refactor-20261101]
    paths: ['.github/workflows/refi-r1-original-ten-completion.yml']
permissions: {contents: read}
env: {OPENBLAS_NUM_THREADS: '1', OMP_NUM_THREADS: '1', MKL_NUM_THREADS: '1', PYTHONUNBUFFERED: '1'}
jobs:
  remaining:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: {reg: [official, phone], f: [0,1,2,3], first: [2,4,6,8]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Preserve exact registered dependency versions and official UCI checksums
        run: |
          python -m pip install --disable-pip-version-check packaging numpy==2.3.5 scipy==1.16.3 pandas==2.2.3 pypmc==1.2.6
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          curl -fsSL --retry 3 --max-time 180 https://archive.ics.uci.edu/static/public/310/ujiindoorloc.zip -o /tmp/uji.zip; unzip -q /tmp/uji.zip -d /tmp/uji
          d=$(dirname "$(find /tmp/uji -name trainingData.csv | head -1)"); python -m research.r1_single_scan.full_draw0.finish_pairs "$d" /tmp/paired '${{ matrix.reg }}' '${{ matrix.f }}' '${{ matrix.first }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'pair-${{ matrix.reg }}-${{ matrix.f }}-${{ matrix.first }}', path: /tmp/paired, if-no-files-found: warn}
  archive:
    if: always() && github.repository == 'Amanon-666/law' && github.ref == 'refs/heads/research/uji-core-refactor-20261101'
    needs: remaining
    permissions: {contents: write, actions: read}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: 'research/uji-core-refactor-20261101'}
      - uses: actions/download-artifact@v4
        with: {pattern: 'pair-*', path: /tmp/paired, merge-multiple: true}
      - name: Versioned evidence only; partials remain explicit
        run: |
          set -euo pipefail
          p=research/r1_single_scan/full_draw0/results/${{ github.run_id }}-${{ github.run_attempt }}; test ! -e "$p"; mkdir -p "$p"; cp -r /tmp/paired/draw* "$p/"; cd "$p"; echo '${{ github.sha }}' > EXECUTED_COMMIT; find . -type f ! -name SHA256SUMS -print0|sort -z|xargs -0 sha256sum > SHA256SUMS; cd - >/dev/null
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'; git add -f "$p"; git commit -m 'Archive original draws 2–9 matched GP, learned, and same-map WKNN rows with explicit failures'; git pull --rebase origin research/uji-core-refactor-20261101; git push origin HEAD:refs/heads/research/uji-core-refactor-20261101; echo "OUT=$p" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with: {name: R1-original-remaining320-rows, path: '${{ env.OUT }}', if-no-files-found: error}
